<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZbyszekMail Client</title>
    <style>
        :root {
            --bg-color: #1a1b26;
            --sidebar-bg: #16161e;
            --panel-bg: #24283b;
            --border-color: #414868;
            --text-color: #c0caf5;
            --text-muted: #7aa2f7;
            --accent-color: #7dcfff;
            --accent-hover: #bb9af7;
            --danger-color: #f7768e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .compose-btn {
            background-color: var(--accent-color);
            color: #1a1b26;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
            transition: background 0.2s;
        }

        .compose-btn:hover {
            background-color: var(--accent-hover);
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-links li {
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-color);
            transition: background 0.2s, color 0.2s;
        }

        .nav-links li:hover, .nav-links li.active {
            background-color: var(--panel-bg);
            color: var(--accent-color);
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 100vh;
        }

        /* Message List */
        .message-list {
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .list-header {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
        }

        .email-item {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .email-item:hover, .email-item.active {
            background-color: var(--panel-bg);
        }

        .email-item .sender {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .email-item .subject {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Email Reader / Compose Viewer */
        .email-viewer {
            background-color: var(--bg-color);
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .viewer-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .viewer-header h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .viewer-meta {
            font-size: 13px;
            color: var(--text-muted);
        }

        .viewer-body {
            font-size: 15px;
            line-height: 1.6;
        }

        /* Compose Modal/View Styles */
        .compose-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
        }

        .compose-form input, .compose-form textarea {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            color: var(--text-color);
            font-size: 14px;
        }

        .compose-form textarea {
            height: 200px;
            resize: vertical;
        }

        .compose-form button {
            background-color: var(--accent-color);
            color: #1a1b26;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: fit-content;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <sidebar>
        <div class="logo">📬 ZbyszekMail</div>
        <button class="compose-btn" onclick="openCompose()">+ Nowa wiadomość</button>
        <ul class="nav-links">
            <li class="active" onclick="switchFolder('inbox', this)">Skrzynka odbiorcza</li>
            <li onclick="switchFolder('sent', this)">Wysłane</li>
            <li onclick="switchFolder('trash', this)">Kosz</li>
        </ul>
    </sidebar>

    <main>
        <section class="message-list">
            <div class="list-header" id="list-title">Skrzynka odbiorcza</div>
            <div id="emails-container">
                <!-- Tutaj wpadają maile -->
            </div>
        </section>

        <section class="email-viewer" id="viewer-container">
            <div class="empty-state">Wybierz wiadomość, aby ją przeczytać</div>
        </section>
    </main>

    <script>
        // Dane początkowe (można edytować lub rozbudowywać)
        let emails = JSON.parse(localStorage.getItem('zbyszek_emails')) || [
            { id: 1, folder: 'inbox', sender: 'github@github.com', subject: 'Security alert: New login detected', body: 'Hello,\n\nWe noticed a new login to your GitHub account from a new device. If this was you, you can safely ignore this email.' },
            { id: 2, folder: 'inbox', sender: 'admin@system.local', subject: 'System Update Complete', body: 'All server packages, Docker containers, and security policies have been successfully updated.' }
        ];

        let currentFolder = 'inbox';
        let activeEmailId = null;

        function renderEmailList() {
            const container = document.getElementById('emails-container');
            container.innerHTML = '';

            const filtered = emails.filter(e => e.folder === currentFolder);

            if (filtered.length === 0) {
                container.innerHTML = '<div style="padding: 20px; color: #7aa2f7; text-align: center;">Brak wiadomości w tym folderze</div>';
                return;
            }

            filtered.forEach(email => {
                const item = document.createElement('div');
                item.className = `email-item ${email.id === activeEmailId ? 'active' : ''}`;
                item.onclick = () => selectEmail(email.id);
                item.innerHTML = `
                    <div class="sender">${email.sender}</div>
                    <div class="subject">${email.subject}</div>
                `;
                container.appendChild(item);
            });
        }

        function switchFolder(folder, element) {
            currentFolder = folder;
            activeEmailId = null;
            document.querySelectorAll('.nav-links li').forEach(li => li.classList.remove('active'));
            element.classList.add('active');

            const titles = { inbox: 'Skrzynka odbiorcza', sent: 'Wysłane', trash: 'Kosz' };
            document.getElementById('list-title').innerText = titles[folder];

            renderEmailList();
            document.getElementById('viewer-container').innerHTML = '<div class="empty-state">Wybierz wiadomość, aby ją przeczytać</div>';
        }

        function selectEmail(id) {
            activeEmailId = id;
            renderEmailList();
            const email = emails.find(e => e.id === id);
            const viewer = document.getElementById('viewer-container');

            viewer.innerHTML = `
                <div class="viewer-header">
                    <h2>${email.subject}</h2>
                    <div class="viewer-meta">Od: <strong>${email.sender}</strong></div>
                </div>
                <div class="viewer-body">${email.body.replace(/\n/g, '<br>')}</div>
            `;
        }

        function openCompose() {
            activeEmailId = null;
            renderEmailList();
            const viewer = document.getElementById('viewer-container');

            viewer.innerHTML = `
                <div class="viewer-header">
                    <h2>Nowa wiadomość</h2>
                </div>
                <div class="compose-form">
                    <input type="text" id="recipient" placeholder="Do (np. znajomy@domena.pl)">
                    <input type="text" id="subject" placeholder="Temat">
                    <textarea id="body" placeholder="Treść wiadomości..."></textarea>
                    <button onclick="sendEmail()">Wyślij</button>
                </div>
            `;
        }

        function sendEmail() {
            const recipient = document.getElementById('recipient').value;
            const subject = document.getElementById('subject').value;
            const body = document.getElementById('body').value;

            if (!recipient || !subject || !body) {
                alert('Wypełnij wszystkie pola!');
                return;
            }

            const newMsg = {
                id: Date.now(),
                folder: 'sent',
                sender: recipient,
                subject: subject,
                body: body
            };

            emails.push(newMsg);
            localStorage.setItem('zbyszek_emails', JSON.stringify(emails));

            alert('Wiadomość została wysłana i zapisana w folderze "Wysłane"!');
            switchFolder('sent', document.querySelectorAll('.nav-links li')[1]);
        }

        // Pierwsze ładowanie listy
        renderEmailList();
    </script>
</body>
</html>
